[project]
name = "fmpg"
version = "0.1.0"
description = "ffmpeg simplified for daily use."
readme = "README.md"
authors = [
    { name = "bisquich", email = "hasbiashshiddiq@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
]

[project.scripts]
fmpg = "fmpg:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
